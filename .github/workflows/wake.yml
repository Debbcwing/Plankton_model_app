name: Wake Streamlit App

on:
  schedule:
    - cron: "0 */4 * * *"   # every 4 hours
  workflow_dispatch:         # allow manual trigger

jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Chrome and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser chromium-chromedriver xvfb
          # Verify installation
          which chromium-browser
          which chromedriver
          chromium-browser --version
          chromedriver --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app_run/requirements.txt

      - name: Verify environment
        run: |
          echo "Python version:"
          python --version
          echo "Chrome/Chromium version:"
          chromium-browser --version || echo "Chromium not found"
          chromedriver --version || echo "Chromedriver not found"

      - name: Run Selenium script
        env:
          STREAMLIT_APP_URL: ${{ secrets.STREAMLIT_APP_URL }}
        run: |
          echo "Running wake script..."
          python app_run/main.py
